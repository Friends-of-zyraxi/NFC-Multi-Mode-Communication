[versions]
agp = "9.4.1"
kotlin = "2.4.10"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
material = "1.10.0"
activityCompose = "1.8.0"
# 必须 ≥ 2025.02.00：NavigationView.kt 的 HorizontalPager / beyondViewportPageCount
# 需要 Compose Foundation 1.7.x。此版本提供 foundation/ui 1.7.8。
composeBom = "2025.02.00"
playServicesNearby = "19.5.0"
fluentuiCore = "0.3.11"
fluentuiControls = "0.3.3"
fluentuiProgress = "0.3.7"
fluentuiTopappbars = "0.3.9"
fluentuiTablayout = "0.3.5"
fluentuiNotification = "0.3.10"
fluentuiMenus = "0.3.5"
fluentuiListitem = "0.3.7"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material = { group = "androidx.compose.material", name = "material" }
play-services-nearby = { module = "com.google.android.gms:play-services-nearby", version.ref = "playServicesNearby" }
fluentui-core = { module = "com.microsoft.fluentui:fluentui_core", version.ref = "fluentuiCore" }
fluentui-controls = { module = "com.microsoft.fluentui:fluentui_controls", version.ref = "fluentuiControls" }
fluentui-progress = { module = "com.microsoft.fluentui:fluentui_progress", version.ref = "fluentuiProgress" }
fluentui-topappbars = { module = "com.microsoft.fluentui:fluentui_topappbars", version.ref = "fluentuiTopappbars" }
fluentui-tablayout = { module = "com.microsoft.fluentui:fluentui_tablayout", version.ref = "fluentuiTablayout" }
fluentui-notification = { module = "com.microsoft.fluentui:fluentui_notification", version.ref = "fluentuiNotification" }
fluentui-menus = { module = "com.microsoft.fluentui:fluentui_menus", version.ref = "fluentuiMenus" }
fluentui-listitem = { module = "com.microsoft.fluentui:fluentui_listitem", version.ref = "fluentuiListitem" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

